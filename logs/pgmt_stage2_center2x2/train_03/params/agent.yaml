seed: 722
device: cuda:1
num_steps_per_env: 24
max_iterations: 20000
empirical_normalization: null
obs_groups:
  policy:
  - proprio
  policy_history:
  - proprio_history
  command_window:
  - command_window
  critic:
  - critic
  terrain_map:
  - terrain_map
  terrain_valid:
  - terrain_valid
clip_actions: null
save_interval: 500
motion_resample_frequency: 0
experiment_name: pgmt_stage2_terrain
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: PGMTStage2Runner
reset_action_std_on_load: -1.0
policy:
  class_name: PGMTActorCritic
  init_noise_std: 1.0
  noise_std_type: scalar
  actor_obs_normalization: true
  critic_obs_normalization: true
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  forward_hidden_dims: null
  forward_obs_normalization: null
  embedding_dim: 128
  num_heads: 4
  command_frames: 8
  history_frames: 10
  rope_base: 10000.0
  terrain_glimpse_cfg: {}
  terrain_mode: enabled
  terrain_observation_cfg:
    version: 3
    packed_key: pgmt_terrain
    map_key: terrain_map
    valid_key: terrain_valid
    shape:
    - 21
    - 21
    size_m:
    - 2.0
    - 2.0
    resolution_m: 0.1
    frame: actual_torso_yaw
    ordering: row=y,col=x; -1..+1 m
    height: sensor_world_z - ground_world_z - offset_m
    offset_m: 0.0
    units: m
    dtype: float32
    invalid_world_z_fill_m: 30.0
    invalid_sensor_z_fill_m: 0.78
    mask: float32 0/1; map_valid AND finite_hit_z AND NOT dropped
    augmentation_enabled: true
    nan_dropout_prob: 0.1
    noise: independent_uniform
    noise_range_m:
    - -0.06
    - 0.06
    clipping_m:
    - -3.0
    - 3.0
    normalization_location: network
    network_z_clip_m: 3.0
    network_normalize_height: true
    noise_refresh: every_observation_function_call
  value_groups:
  - upper
  - lower
  - terrain
  - auxiliary
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0001
  backbone_lr_scale: 1.0
  vision_adapter_lr_scale: 1.0
  critic_lr_scale: 1.0
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
  vel_loss_coef: 0.0
  vel_loss_type: huber
  vel_loss_delta: 1.0
  anchor_est_loss_coef: 0.0
  anchor_est_loss_type: huber
  anchor_est_loss_delta: 1.0
  foot_traj_loss_coef: 0.0
  foot_traj_loss_type: huber
  foot_traj_loss_delta: 1.0
  foot_traj_target_obs_key: null
  aux_loss_scale: 1.0
  aux_loss_coef: {}
  sonic_loss_coef: null
  use_mean_action_for_rollout: false
  mean_action_rollout_iters: 0
  value_only_warmup_iters: 0
  action_prior_loss_coef: 0.0
  warmup_freeze_iters: 0
  warmup_freeze_encoders: true
  warmup_freeze_control_decoder: true
  warmup_freeze_action_std: true
  warmup_reset_optimizer_state: false
  warmup_reset_rnd_optimizer_state: false
  warmup_unfreeze_lr_scale: 1.0
  debug_numeric: false
  debug_print_freq: 1
  debug_rollout_steps: 1
  debug_update_batches: 2
  debug_raise_on_nonfinite: false
